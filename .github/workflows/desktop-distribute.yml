name: Desktop - Build & Distribute (pilote)

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Application desktop a construire"
        required: true
        default: "leopardo_accounting"
        type: choice
        options:
          - leopardo_accounting
      platform:
        description: "Plateforme(s) cible(s)"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - windows
          - macos
      environment:
        description: "Volet API cible (dev = continu ; pilot = pilote interne)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - pilot
      api_url:
        description: "URL API explicite (defaut : vars.PROD_API_BASE_URL, garde #4524)"
        required: false
        type: string

permissions:
  contents: write   # publication du canal dev (Release GitHub non signée, P06 §3.4)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: desktop-distribute-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    timeout-minutes: 120
    name: Desktop build (${{ matrix.os.name }})
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os:
              name: windows
              runner: windows-latest
            build: windows
            artifact_path: front/mobile_apps/leopardo_accounting/build/windows/x64/runner/Release/
            extra_args: ""
          - os:
              name: macos
              runner: macos-latest
            build: macos
            artifact_path: front/mobile_apps/leopardo_accounting/build/macos/Build/Products/Release/
            extra_args: "--no-codesign"   # pilote interne : pas de notarisation (P06 §4)

    steps:
      # Garde #4524 : jamais de build sans URL d'API explicite (fail-open supprimé).
      - name: Guard API_BASE_URL (#4524)
        shell: bash
        run: |
          API_URL="${{ inputs.api_url }}"
          if [[ -z "${API_URL}" ]]; then
            API_URL="${{ vars.PROD_API_BASE_URL }}"
          fi
          if [[ -z "${API_URL}" ]]; then
            echo "::error::API_BASE_URL must be set (input api_url ou vars.PROD_API_BASE_URL) — garde #4524."
            exit 1
          fi
          echo "API_BASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "Cible API (volet ${{ inputs.environment }}) : ${API_URL}"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@1a449c444387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Build ${{ matrix.os.name }} (release)
        shell: bash
        # Fix MSVC 14.51 (runner windows-2025) : local_auth_windows (dépendance de
        # leopardo_core) utilise <experimental/coroutine> retiré par la STL récente
        # (erreur STL1011). Le macro officiel MSVC supprime l'erreur — parade amont
        # documentée, à retirer quand le plugin sera compatible (suivi #7056).
        env:
          CXXFLAGS: "-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        run: |
          set -euo pipefail
          cd "front/mobile_apps/${{ inputs.app }}"
          flutter build ${{ matrix.build }} --release ${{ matrix.extra_args }} \
            --dart-define=API_BASE_URL="${API_BASE_URL}"

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.build }}" == "windows" ]]; then
            ARTIFACT="front/mobile_apps/${{ inputs.app }}/build/windows/x64/runner/Release"
            test -f "${ARTIFACT}/${{ inputs.app }}.exe"
            du -h "${ARTIFACT}/${{ inputs.app }}.exe"
          else
            ARTIFACT="front/mobile_apps/${{ inputs.app }}/build/macos/Build/Products/Release"
            test -d "${ARTIFACT}/${{ inputs.app }}.app"
            du -sh "${ARTIFACT}/${{ inputs.app }}.app"
          fi

      - name: Package + checksums (zip + SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import hashlib, pathlib, shutil, zipfile
          app = "${{ inputs.app }}"
          osname = "${{ matrix.os.name }}"
          build = "${{ matrix.build }}"
          base = pathlib.Path(f"front/mobile_apps/{app}/build")
          if build == "windows":
              src = base / "windows/x64/runner/Release"
              target_name = f"{app}.exe"
          else:
              src = base / "macos/Build/Products/Release"
              target_name = f"{app}.app"
          assert (src / target_name).exists(), f"artefact introuvable: {src / target_name}"
          out = pathlib.Path("dist"); shutil.rmtree(out, ignore_errors=True); out.mkdir()
          zip_path = out / f"leopardo-desktop-{app}-{osname}.zip"
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as z:
              z.write(src / target_name, arcname=target_name)
              if build == "windows":
                  for child in src.iterdir():
                      if child.name != target_name and child.is_file():
                          z.write(child, arcname=child.name)
          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          (out / f"leopardo-desktop-{app}-{osname}.sha256").write_text(f"{digest}  {zip_path.name}\n")
          print(f"{zip_path} sha256={digest}")
          PYEOF

      - name: Publish dev release (NON SIGNÉ — usage interne, P06 §3.4)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="desktop-${{ inputs.app }}-dev"
          NOTES="Canal dev desktop — build NON SIGNÉ, usage interne/pilote.
          App: ${{ inputs.app }} | Plateforme: ${{ matrix.os.name }} | Run: ${{ github.run_id }}
          Volet API: ${{ inputs.environment }} | Commit: ${{ github.sha }}
          Aucune distribution publique (protocole P06 / #3257)."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* --title "Desktop dev — ${{ inputs.app }}" --notes "${NOTES}" --prerelease
          fi

      - name: Upload artifact (canal pilote interne — aucun lien public)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: leopardo-desktop-${{ inputs.app }}-${{ matrix.os.name }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
