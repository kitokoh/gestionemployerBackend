name: Desktop - Build & Distribute (pilote)

# Chaîne desktop Leopardo — protocole P06, tranches verticales (registry docs/desktop/README.md).
# Build du client desktop par BC vertical, à la demande :
#   - Windows (.exe) / macOS (.app), release ;
#   - garde API_BASE_URL (#4524) : jamais de build sans volet API explicite ;
#   - packaging zip + SHA-256 ;
#   - canal dev : Release GitHub `desktop-<app>-dev` (NON SIGNÉE, marquée pré-release) ;
#   - artefact de run (14 j) pour les pilotes.
# Aucune distribution publique (P06 / #3257) : la signature/notarisation est une décision PM
# distincte, par tranche.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Application desktop a construire"
        required: true
        default: "leopardo_accounting"
        type: choice
        options:
          - leopardo_accounting
      platform:
        description: "Plateforme(s) cible(s)"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - windows
          - macos
      environment:
        description: "Volet API cible (dev = continu ; pilot = pilote interne)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - pilot
      api_url:
        description: "URL API explicite (defaut : vars.PROD_API_BASE_URL, garde #4524)"
        required: false
        type: string

permissions:
  contents: write   # publication du canal dev (Release GitHub non signée, P06 §3.4)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: desktop-distribute-${{ github.ref }}-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  # Matrice calculée depuis l'input `platform` (évite de lancer les 2 OS quand un seul est visé).
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Build matrix from platform input
        id: set
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM="${{ inputs.platform }}"
          case "${PLATFORM}" in
            windows) JSON='{"include":[{"os":"windows-latest","build":"windows","artifact":"front/mobile_apps/'"${{ inputs.app }}"'/build/windows/x64/runner/Release","extra":""}]}' ;;
            macos)   JSON='{"include":[{"os":"macos-latest","build":"macos","artifact":"front/mobile_apps/'"${{ inputs.app }}"'/build/macos/Build/Products/Release","extra":""}]}' ;;
            both)    JSON='{"include":[{"os":"windows-latest","build":"windows","artifact":"front/mobile_apps/'"${{ inputs.app }}"'/build/windows/x64/runner/Release","extra":""},{"os":"macos-latest","build":"macos","artifact":"front/mobile_apps/'"${{ inputs.app }}"'/build/macos/Build/Products/Release","extra":""}]}' ;;
            *)       echo "::error::platform inconnu: ${PLATFORM}"; exit 1 ;;
          esac
          echo "matrix=${JSON}" >> "$GITHUB_OUTPUT"
          echo "${JSON}"

  build-and-package:
    needs: prepare
    timeout-minutes: 120
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      # Garde #4524 : jamais de build sans URL d'API explicite (fail-open supprimé).
      - name: Guard API_BASE_URL (#4524)
        shell: bash
        run: |
          API_URL="${{ inputs.api_url }}"
          if [[ -z "${API_URL}" ]]; then
            API_URL="${{ vars.PROD_API_BASE_URL }}"
          fi
          if [[ -z "${API_URL}" ]]; then
            echo "::error::API_BASE_URL must be set (input api_url ou vars.PROD_API_BASE_URL) — garde #4524."
            exit 1
          fi
          echo "API_BASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "Cible API (volet ${{ inputs.environment }}) : ${API_URL}"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install dependencies (app)
        working-directory: front/mobile_apps/${{ inputs.app }}
        run: flutter pub get

      # Codegen + localisations partagés de leopardo_core, GÉNÉRÉS (non versionnés) :
      # - *.g.dart (drift, json_serializable) — #6590 ;
      # - app_localizations.dart (sans quoi la compilation windows/macos échoue).
      - name: Regenerate shared codegen + localizations (leopardo_core)
        working-directory: front/mobile_apps/leopardo_core
        run: |
          flutter pub get
          dart run build_runner build
          flutter gen-l10n

      - name: Build (${{ matrix.build }}, release)
        shell: bash
        # Fix MSVC récent (runners windows-2025) : local_auth_windows (dépendance de
        # leopardo_core) utilise <experimental/coroutine>, retiré par la STL actuelle
        # (erreur STL1011). Le macro officiel MSVC supprime l'erreur — parade amont
        # documentée, à retirer quand le plugin sera compatible (suivi #7056).
        env:
          CXXFLAGS: "-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        run: |
          set -euo pipefail
          cd "front/mobile_apps/${{ inputs.app }}"
          flutter build ${{ matrix.build }} --release ${{ matrix.extra }} \
            --dart-define=API_BASE_URL="${API_BASE_URL}"

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.build }}" == "windows" ]]; then
            test -f "${{ matrix.artifact }}/${{ inputs.app }}.exe"
            du -h "${{ matrix.artifact }}/${{ inputs.app }}.exe"
          else
            test -d "${{ matrix.artifact }}/${{ inputs.app }}.app"
            du -sh "${{ matrix.artifact }}/${{ inputs.app }}.app"
          fi

      - name: Package + checksums (zip + SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import hashlib, pathlib, shutil, zipfile
          app = "${{ inputs.app }}"
          osname = "${{ matrix.build }}"
          build = "${{ matrix.build }}"
          base = pathlib.Path(f"front/mobile_apps/{app}/build")
          if build == "windows":
              src = base / "windows/x64/runner/Release"
              target_name = f"{app}.exe"
          else:
              src = base / "macos/Build/Products/Release"
              target_name = f"{app}.app"
          assert (src / target_name).exists(), f"artefact introuvable: {src / target_name}"
          out = pathlib.Path("dist"); shutil.rmtree(out, ignore_errors=True); out.mkdir()
          zip_path = out / f"leopardo-desktop-{app}-{osname}.zip"
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as z:
              z.write(src / target_name, arcname=target_name)
              if build == "windows":
                  for child in src.iterdir():
                      if child.name != target_name and child.is_file():
                          z.write(child, arcname=child.name)
          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          (out / f"leopardo-desktop-{app}-{osname}.sha256").write_text(f"{digest}  {zip_path.name}\n")
          print(f"{zip_path} sha256={digest}")
          PYEOF

      - name: Publish dev release (NON SIGNÉ — usage interne, P06 §3.4)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="desktop-${{ inputs.app }}-dev"
          NOTES="Canal dev desktop — build NON SIGNÉ, usage interne/pilote.
          App: ${{ inputs.app }} | Plateforme: ${{ matrix.build }} | Run: ${{ github.run_id }}
          Volet API: ${{ inputs.environment }} | Commit: ${{ github.sha }}
          Aucune distribution publique (protocole P06 / #3257)."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* --title "Desktop dev — ${{ inputs.app }}" --notes "${NOTES}" --prerelease
          fi

      - name: Upload artifact (canal pilote interne — aucun lien public)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: leopardo-desktop-${{ inputs.app }}-${{ matrix.build }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
